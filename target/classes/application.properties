spring.application.name=aml

# DATABASE CONFIGURATION

spring.datasource.url=jdbc:mysql://localhost:3306/aml?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.initialization-fail-timeout=0

# SERVER

server.port=8080
spring.jackson.default-property-inclusion=non_null
jwt.expiration=600000
# Override JWT_SECRET with a private random value in deployed environments.
jwt.secret=${JWT_SECRET:aml-local-dev-secret-change-before-production-2026}
app.frontend.password-setup-url=${APP_PASSWORD_SETUP_URL:http://localhost:3000/set-password}
app.frontend.password-reset-url=${APP_PASSWORD_RESET_URL:http://localhost:3000/reset-password}

# LOGGING

logging.level.org.springframework.security=DEBUG

# G Mail Configuration

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=subbareddy1105@gmail.com
spring.mail.password=yebdfmywrjpt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RATE LIMIT CONFIGURATION

app.rate-limit.window-seconds=60
app.rate-limit.default-limit=20
app.rate-limit.sensitive-limit=5
app.rate-limit.retry-after-seconds=60
